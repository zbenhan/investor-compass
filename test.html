<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" data-lang="site.description">

    <link rel="stylesheet" href="css/style.css">

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white">
        <div class="container">
            <a class="navbar-brand" href="index.html" data-lang="site.title">投知罗盘</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav me-4">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html" data-lang="nav.home">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="test.html" data-lang="nav.test">开始测试</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="articles.html" data-lang="nav.articles">投资知识</a>
                    </li>
                </ul>
                <!-- 语言选择器 -->
                <select id="language-selector" class="form-select form-select-xs" style="width: auto;">
                    <option value="zh" data-lang="language.zh">中文</option>
                    <option value="en" data-lang="language.en">English</option>
                    <option value="fr" data-lang="language.fr">Français</option>
                    <option value="es" data-lang="language.es">Español</option>
                </select>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- 测试进度 -->
                <div class="test-progress mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="mb-0" data-lang="test.progress">测试进度</h5>
                        <span id="progressText" class="text-muted">第 1/20 题</span>
                    </div>
                    <div class="progress">
                        <div id="progressBar" class="progress-bar" role="progressbar" style="width: 5%" aria-valuenow="5" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                </div>

                <!-- 测试题目 -->
                <div id="testCard" class="mb-3">
                    <div class="question-header mb-3">
                        <span id="questionCategory" class="badge bg-info">决策思维与依据</span>
                    </div>
                    <h5 id="questionText" class="mb-3">当你看好一只股票但市场普遍看跌时，你的第一反应是？</h5>
                    <div id="optionsList" class="list-group">
                        <!-- 选项将通过JavaScript动态生成 -->
                    </div>
                </div>

                <!-- 导航按钮 -->
                <div class="d-flex justify-content-between">
                    <button id="prevBtn" class="btn btn-secondary" disabled data-lang="test.prevButton">上一题</button>
                    <button id="nextBtn" class="btn btn-primary" data-lang="test.nextButton">下一题</button>
                    <button id="submitBtn" class="btn btn-success" style="display: none;" data-lang="test.submitButton">提交测试</button>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-light py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <h5 data-lang="footer.contact">联系方式</h5>
                    <p>邮箱: zbenhan0123@gmail.com</p>
                </div>
                <div class="col-md-4">
                    <h5 data-lang="footer.links">友情链接</h5>
                    <a href="https://valuegu.com" target="_blank">ValueGu.com</a>
                </div>
                <div class="col-md-4">
                    <h5 data-lang="footer.legal">法律声明</h5>
                    <a href="privacy.html" data-lang="footer.privacy">隐私政策</a> | 
                    <a href="terms.html" data-lang="footer.terms">服务条款</a> | 
                    <a href="about.html" data-lang="footer.about">关于网站</a>
                </div>
            </div>
            <div class="text-center mt-3">
                <p data-lang="footer.copyright">&copy; 2025 投知罗盘 - A-share.com. 保留所有权利.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="data/questions.js"></script>
    <script src="js/main.js"></script>
    <script src="js/test.js"></script>

</html>
